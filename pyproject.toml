[project]
name = "espn-ff"
version = "0.1.0"
description = "Pull your ESPN fantasy football league from the API and make charts out of it"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["espn_ff"]
